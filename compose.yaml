name: lahifact
x-backend: &backend
  build: ./backend
  volumes:
    - ./backend:/app
    - ./backend/php.ini:/usr/local/etc/php/conf.d/lahifact.ini:ro
    - ./Documentacion SUNAT:/documentation:ro
  environment: &environment
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: http://localhost:8000
    APP_TIMEZONE: America/Lima
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: lahifact
    DB_USERNAME: lahifact
    DB_PASSWORD: ${DB_PASSWORD:-lahifact_local}
    QUEUE_CONNECTION: database
    CACHE_STORE: database
    SESSION_DRIVER: database
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    FRONTEND_URL: http://localhost:5173
  depends_on:
    postgres:
      condition: service_healthy
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: lahifact
      POSTGRES_USER: lahifact
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lahifact_local}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lahifact"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    <<: *backend
    environment:
      <<: *environment
      PHP_CLI_SERVER_WORKERS: 4
    ports:
      - "8000:8000"
  worker:
    <<: *backend
    command: php artisan queue:work --sleep=3 --tries=5 --timeout=90
    restart: unless-stopped
  scheduler:
    <<: *backend
    command: php artisan schedule:work
    restart: unless-stopped
  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    environment:
      VITE_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
volumes:
  postgres_data:
  frontend_modules:
